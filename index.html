<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python 学习笔记</title><style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#202638;--muted:#6f7890;--line:#e2e7f0;--accent:#5368d7;--soft:#edf0ff;--code:#202638;--danger:#a43434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.layout{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{padding:30px 18px;background:var(--paper);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:0 10px 17px}.brand b{display:block;font-size:20px}.brand small{color:var(--muted)}.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}nav{margin-top:16px}nav a{display:block;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:7px;cursor:pointer}nav a:hover,nav a.active{color:var(--accent);background:var(--soft);font-weight:650}.main{max-width:1000px;width:100%;margin:auto;padding:50px clamp(20px,6vw,80px)}.hero h1{font-size:clamp(32px,5vw,48px);line-height:1.2;margin:5px 0}.eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.12em}.hero p,.hint{color:var(--muted)}.hint{border-left:4px solid var(--accent);background:var(--soft);padding:12px 16px;border-radius:0 8px 8px 0}.article{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 36px;margin-top:24px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:22px}.toolbar button{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:7px 11px;cursor:pointer;color:var(--ink)}.toolbar .primary{background:var(--accent);border-color:var(--accent);color:#fff}.status{font-size:13px;color:var(--muted)}.article h1{font-size:26px}.article h2{font-size:18px;margin:30px 0 9px;padding-bottom:7px;border-bottom:1px solid var(--line)}.article h3{font-size:15px}.article strong{font-weight:750}.article em{font-style:italic}.article li{margin:4px 0}.article code{background:var(--soft);color:var(--accent);padding:1px 5px;border-radius:4px}.article pre{background:var(--code);padding:15px;border-radius:8px;overflow:auto}.article pre code{background:none;color:#eff1fb;padding:0}.article blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:8px 14px;color:var(--muted);background:var(--soft)}.error{color:var(--danger)}.wysiwyg{min-height:120px;border:1px solid var(--line);border-radius:8px;background:#fbfcff;color:var(--ink);padding:12px;outline:none}.wysiwyg:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.wysiwyg p{margin:8px 0}.wysiwyg ul{padding-left:24px}.wysiwyg pre{white-space:pre-wrap}.formatbar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.formatbar button{padding:5px 9px;font-size:13px}.formatbar button:hover{background:var(--soft)}.fixed{font-size:12px;color:var(--muted);margin-left:auto}@media(max-width:760px){.layout{display:block}.side{position:static;height:auto}.main{padding:30px 16px}.article{padding:22px 18px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><b>Python 学习笔记</b><small>网页编辑 · Markdown · Git</small></div><input id="search" class="search" placeholder="搜索章节"><nav id="nav"></nav></aside><main class="main"><div class="hero"><div class="eyebrow">PYTHON LEARNING NOTES</div><h1>Python 学习笔记</h1><p>网页与 VS Code 共用 <code>notes/</code> 中的 Markdown 文件。网页保存后，Git 能直接记录修改。</p></div><div class="hint">编辑模式下，七个模块标题固定，只有标题下方内容可编辑。保存会写入真实 Markdown 文件；VS Code 将立即显示文件已更改。</div><article id="article" class="article">正在加载章节目录…</article></main></div><script>
const sectionTitles=['一、知识点','二、专业术语','三、语法','四、示例代码','五、注意事项','六、常用函数/方法','七、我的理解'];
const nav=document.querySelector('#nav'),article=document.querySelector('#article'),search=document.querySelector('#search');let chapters=[],current=null,currentMd='';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function inline(s){
  // Protect inline code first so Markdown symbols inside code stay literal.
  const codes=[];
  let out=esc(s).replace(/`([^`]+)`/g,(_,code)=>{codes.push('<code>'+code+'</code>');return `\u0000CODE${codes.length-1}\u0000`});
  // Render the Markdown produced by the visual editor in normal reading mode.
  out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  out=out.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return out.replace(/\u0000CODE(\d+)\u0000/g,(_,i)=>codes[Number(i)]);
}
function render(md){let out='',inCode=false,code=[],inList=false;const close=()=>{if(inList){out+='</ul>';inList=false}};for(const line of md.replace(/\r/g,'').split('\n')){if(line.startsWith('```')){if(inCode){out+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=[];inCode=false}else{close();inCode=true}continue}if(inCode){code.push(line);continue}if(/^### /.test(line)){close();out+='<h3>'+inline(line.slice(4))+'</h3>'}else if(/^## /.test(line)){close();out+='<h2>'+inline(line.slice(3))+'</h2>'}else if(/^# /.test(line)){close();out+='<h1>'+inline(line.slice(2))+'</h1>'}else if(/^> /.test(line)){close();out+='<blockquote>'+inline(line.slice(2))+'</blockquote>'}else if(/^- /.test(line)){if(!inList){out+='<ul>';inList=true}out+='<li>'+inline(line.slice(2))+'</li>'}else if(line.trim()===''){close()}else if(!/^<!--/.test(line)){close();out+='<p>'+inline(line)+'</p>'}}return out}
function splitMd(md){const title=(md.match(/^# .+$/m)||['# 未命名章节'])[0];const pieces={};let matches=[...md.matchAll(/^## (.+)$/gm)];for(let i=0;i<matches.length;i++){let name=matches[i][1].trim(),start=matches[i].index+matches[i][0].length,end=i+1<matches.length?matches[i+1].index:md.length;if(sectionTitles.includes(name))pieces[name]=md.slice(start,end).trim()}return {title, pieces}}
function view(){article.innerHTML=`<div class="toolbar"><button class="primary" id="edit">编辑本章</button><button id="reload">重新读取文件</button><span class="status">当前为阅读模式</span></div>${render(currentMd)}`;bindToolbar()}
function toolbar(){return `<div class="formatbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="insertUnorderedList">列表</button><button data-cmd="formatBlock" data-value="blockquote">引用</button><button data-cmd="formatBlock" data-value="pre">代码</button><button data-cmd="removeFormat">清除格式</button></div>`}
function mdToHtml(s){let out='',lines=s.replace(/\r/g,'').split('\n'),inCode=false,code=[];for(const line of lines){if(line.startsWith('```')){if(inCode){out+='<pre>'+esc(code.join('\n'))+'</pre>';code=[];inCode=false}else inCode=true;continue}if(inCode){code.push(line);continue}if(/^\s*- /.test(line)){if(!out.endsWith('<ul>'))out+='<ul>';out+='<li>'+inline(line.replace(/^\s*- /,''))+'</li>';continue}else if(out.endsWith('</li>'))out+='</ul>';if(!line.trim()){continue}if(/^> /.test(line))out+='<blockquote>'+inline(line.slice(2))+'</blockquote>';else out+='<p>'+inline(line)+'</p>'}if(out.endsWith('</li>'))out+='</ul>';return out}
function htmlToMd(el){let lines=[];function walk(n){if(n.nodeType===3){return n.textContent}if(n.nodeType!==1)return '';let tag=n.tagName.toLowerCase(),text=[...n.childNodes].map(walk).join('');if(tag==='br')return '\n';if(tag==='li')return '- '+text.trim()+'\n';if(tag==='blockquote')return text.trim().split('\n').map(x=>'> '+x).join('\n')+'\n';if(tag==='pre')return '```\n'+n.innerText.replace(/\n$/,'')+'\n```\n';if(tag==='strong'||tag==='b')return '**'+text+'**';if(tag==='em'||tag==='i')return '*'+text+'*';if(tag==='p'||tag==='div'||tag==='ul')return text.trim()+'\n';return text}return walk(el).replace(/\n{3,}/g,'\n\n').trim()}
function edit(){const {title,pieces}=splitMd(currentMd);article.innerHTML=`<div class="toolbar"><button class="primary" id="save">保存到 Markdown 文件</button><button id="cancel">取消编辑</button><span class="fixed">模块标题已固定</span><span class="status" id="status"></span></div><h1>${inline(title.slice(2))}</h1>${sectionTitles.map(t=>`<h2>${t}</h2>${toolbar()}<div class="wysiwyg" contenteditable="true" data-section="${t}">${mdToHtml(pieces[t]||'')}</div>`).join('')}`;document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null)});bindToolbar()}
function makeMarkdown(){const title=splitMd(currentMd).title;return title+'\n\n'+sectionTitles.map(t=>'## '+t+'\n\n'+htmlToMd(document.querySelector(`[data-section="${t}"]`))).join('\n\n')+'\n'}
async function save(){const status=document.querySelector('#status');status.textContent='正在保存…';const md=makeMarkdown();try{const r=await fetch('/api/notes/'+current.file,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({markdown:md})});if(!r.ok)throw Error(r.status);currentMd=md;status.textContent='已保存到 notes/'+current.file+' ✓';setTimeout(view,800)}catch(e){status.textContent='保存失败：请确认通过 server.py 启动网站。'}}
function bindToolbar(){const el=id=>document.querySelector(id);if(el('#edit'))el('#edit').onclick=edit;if(el('#reload'))el('#reload').onclick=()=>openChapter(current);if(el('#cancel'))el('#cancel').onclick=view;if(el('#save'))el('#save').onclick=save}
async function openChapter(c){current=c;try{const r=await fetch('notes/'+c.file);if(!r.ok)throw Error(r.status);currentMd=await r.text();view();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===c.id))}catch(e){article.innerHTML='<p class="error">无法读取文件。请双击“启动网站.bat”，然后在浏览器访问显示的地址。</p>'}}
fetch('notes/index.json').then(r=>r.json()).then(data=>{chapters=data;data.forEach(c=>{const a=document.createElement('a');a.textContent=`${c.id}. ${c.title}`;a.dataset.id=c.id;a.onclick=()=>openChapter(c);nav.append(a)});openChapter(data[0])}).catch(()=>article.innerHTML='<p class="error">请使用 server.py 启动网站。</p>');search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll('nav a').forEach((a,i)=>a.hidden=!chapters[i].title.toLowerCase().includes(q))};
</script></body></html>
